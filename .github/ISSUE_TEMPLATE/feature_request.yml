name: Feature request
description: Propose a product, documentation or engineering improvement.
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Which user need or engineering gap does this address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the expected behaviour, data flow and interface impact.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Portfolio content
        - Project lifecycle simulator
        - Audio studio
        - 3D background
        - Accessibility
        - Performance
        - Documentation
        - Deployment
        - Security and privacy
    validations:
      required: true
