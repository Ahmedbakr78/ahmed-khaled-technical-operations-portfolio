<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Page Not Found — Ahmed Khaled</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 2rem;
        background: radial-gradient(circle at 20% 10%, #18181b 0, #000 46%, #000 100%);
        color: #fff; font-family: "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
      }
      .card {
        width: min(620px, 100%); padding: clamp(2rem, 6vw, 3.5rem); border-radius: 32px;
        background: rgba(10, 10, 14, 0.92); border: 1px solid rgba(255, 255, 255, 0.18);
        box-shadow: 0 28px 80px rgba(0, 0, 0, 0.65); text-align: center;
      }
      .monogram {
        width: 72px; height: 72px; margin: 0 auto 1.5rem; border-radius: 22px;
        border: 1px solid rgba(255, 255, 255, 0.28); display: grid; place-items: center;
        font-family: Georgia, serif; font-size: 1.6rem; font-weight: 700; letter-spacing: -0.06em;
      }
      .eyebrow { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 0.68rem; letter-spacing: 0.18em; text-transform: uppercase; color: #a1a1aa; }
      h1 { margin: 0.75rem 0 0.5rem; font-family: Georgia, serif; font-size: clamp(2.2rem, 7vw, 3.4rem); line-height: 1.05; letter-spacing: -0.03em; }
      p { margin: 0 auto 1.75rem; max-width: 28rem; color: #a1a1aa; line-height: 1.65; font-size: 0.92rem; }
      a {
        display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem;
        padding: 0.85rem 1.4rem; border-radius: 999px; background: #fff; color: #000;
        text-decoration: none; font-weight: 700; font-size: 0.85rem;
      }
      a:hover { background: #e4e4e7; }
      .links { display: flex; flex-wrap: wrap; justify-content: center; gap: 0.6rem; }
      .links a.secondary { background: rgba(255, 255, 255, 0.08); color: #fff; border: 1px solid rgba(255, 255, 255, 0.2); }
      .links a.secondary:hover { background: rgba(255, 255, 255, 0.16); }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="monogram">AK</div>
      <span class="eyebrow">404 · Route not found</span>
      <h1>This page is off the drawing.</h1>
      <p>The requested route does not exist. Return to the portfolio overview, review the engineering documentation, or get in touch directly.</p>
      <div class="links">
        <a href="/">Return to portfolio</a>
        <a class="secondary" href="/#docs">Documentation</a>
        <a class="secondary" href="/#contact">Contact</a>
      </div>
    </main>
  </body>
</html>
